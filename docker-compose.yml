services:
  postgres:
    image: postgres:16-alpine
    container_name: fallguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fallguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fallguard_secret}
      POSTGRES_DB: ${POSTGRES_DB:-fallguard_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fallguard} -d ${POSTGRES_DB:-fallguard_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: fallguard-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  chromadb:
    image: chromadb/chroma:0.4.24
    container_name: fallguard-chroma
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSISTENCE_DIRECTORY=/chroma/chroma

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fallguard-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-fallguard}:${POSTGRES_PASSWORD:-fallguard_secret}@postgres:5432/${POSTGRES_DB:-fallguard_db}
      - MQTT_BROKER_HOST=mqtt
      - MQTT_BROKER_PORT=1883
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - NOTIFICATION_PROVIDER=${NOTIFICATION_PROVIDER:-mock}
      - ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy
      mqtt:
        condition: service_started
      chromadb:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fallguard-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:
  chroma_data:
